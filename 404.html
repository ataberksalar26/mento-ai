<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı | Mento AI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#07111d; --gold:#f5a623; --text:#f7f7f4; --muted:#b9c3d2; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 20%,rgba(77,125,243,.2),transparent 30%),var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(580px,100%); text-align:center; padding:56px 24px; } .mark { width:58px; height:58px; margin:0 auto 30px; border:1px solid rgba(245,166,35,.4); border-radius:16px; display:grid; place-items:center; color:var(--gold); font-size:31px; font-weight:900; }
    h1 { margin:0; font-size:clamp(36px,8vw,62px); letter-spacing:-.05em; } p { margin:18px auto 30px; max-width:440px; color:var(--muted); line-height:1.65; } a { display:inline-flex; min-height:48px; align-items:center; padding:0 22px; border-radius:10px; background:linear-gradient(180deg,#ffcb70,#c9820a); color:#171004; text-decoration:none; font-weight:800; }
  </style>
</head>
<body><main><div class="mark">M</div><h1>Bu sayfa burada değil.</h1><p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya dönüp çalışma planını oluşturmaya devam edebilirsin.</p><a href="/">Ana sayfaya dön →</a></main></body>
</html>

workflows:
  mento-ai-ios-release:
    name: Mento AI iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        APP_STORE_APPLE_ID: "6796065929"
        BUNDLE_ID: "com.ataberksalar.mentoai"
        XCODE_PROJECT: "ios-app/MentoAI.xcodeproj"
        XCODE_SCHEME: "MentoAI"
      xcode: latest
    scripts:
      - name: Prepare Apple signing key
        script: |
          set -e
          KEY_ID="$(printf '%s' "$APP_STORE_CONNECT_KEY_IDENTIFIER" | tr -d '[:space:]')"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "APP_STORE_CONNECT_PRIVATE_KEY is missing from appstore_credentials."
            exit 1
          fi
          if printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '\r\n ' | base64 -D > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          if ! openssl pkey -in "$KEY_PATH" -noout; then
            echo "The private key is not a valid Apple .p8 file. Generate a new key and copy it with APPLE-KEY-BASE64.cmd."
            exit 1
          fi
          echo "Apple signing key is ready."
      - name: Prepare distribution certificate key
        script: |
          set -e
          CERTIFICATE_KEY_PATH="$CM_BUILD_DIR/ios_distribution_private_key.pem"
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is missing from appstore_credentials."
            exit 1
          fi
          if printf '%s' "$CERTIFICATE_PRIVATE_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERTIFICATE_KEY_PATH"
          else
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d '\r\n ' | base64 -D > "$CERTIFICATE_KEY_PATH"
          fi
          chmod 600 "$CERTIFICATE_KEY_PATH"
          openssl pkey -in "$CERTIFICATE_KEY_PATH" -noout
          echo "Distribution certificate key is ready."
      - name: Initialize signing keychain
        script: |
          keychain initialize
      - name: Fetch App Store signing files
        script: |
          set -e
          KEY_ID="$(printf '%s' "$APP_STORE_CONNECT_KEY_IDENTIFIER" | tr -d '[:space:]')"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          APP_STORE_PRIVATE_KEY="$(cat "$KEY_PATH")"
          CERTIFICATE_PRIVATE_KEY_CONTENT="$(cat "$CM_BUILD_DIR/ios_distribution_private_key.pem")"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$KEY_ID" \
            --private-key "$APP_STORE_PRIVATE_KEY" \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY_CONTENT"
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Apply App Store profile to Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios-app"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build IPA for TestFlight
        script: |
          set -e
          KEY_ID="$(printf '%s' "$APP_STORE_CONNECT_KEY_IDENTIFIER" | tr -d '[:space:]')"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/MentoAI.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build/ios/ipa"
          EXPORT_OPTIONS="$CM_BUILD_DIR/build/ios/ExportOptions.plist"

          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>U3698U6257</string>
          </dict></plist>
          EOF

          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_PATH"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - ataberksalar@gmail.com
        notify:
          success: true
          failure: true
